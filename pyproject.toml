[project]
name = "med-wsp"
version = "0.1.0"
description = "Weight-space programming for medical reasoning: MIT WSP replication, Phi-3.5 vs MediPhi circuit discovery, failure-guided editing, looped layers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=4.57",
    "accelerate>=1.2",
    "safetensors>=0.5",
    "datasets>=3.2",
    "huggingface-hub>=0.30",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "pandas>=2.2",
    "sympy>=1.13",
    "networkx>=3.4",
    "einops>=0.8",
    "tqdm>=4.67",
    "matplotlib>=3.10",
    "math-verify>=0.7",
    "pypdf>=5.0",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
extend-exclude = ["external", ".claude", "paper/vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
